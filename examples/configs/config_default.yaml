# OpenPenny default configuration (active mode).
#
# This is the entry-point file. It pulls in the per-domain configs from the
# files listed under `includes:`. Edit those files (or override fields
# inline below) to customise behaviour. The combined config is validated
# against `config_schema.json` before OpenPenny starts.
#
# To run with this file:
#   sudo ./build/openpenny_cli \
#       --config examples/configs/config_default.yaml \
#       --mode active --iface <ifname> --queue 0 --tun xdp-tun

# Logging. `mode: console` writes to stdout. Use `level: debug` for
# verbose troubleshooting; `info` is the right default for production.
log:
  mode: console
  level: info

# Includes are resolved relative to this file. Each include points at a
# small, focused YAML so day-to-day policy changes don't disturb host
# setup (and vice versa).
includes:
  # Which traffic to touch (include/exclude rules).
  traffic_policy:     policies/traffic_default.yaml

  # What to do with selected traffic (active/passive, thresholds).
  runtime_policy:     policies/runtime_active.yaml

  # Host-specific dataplane settings (interface, backend, queues, XDP).
  platform:           platform/af_xdp.yaml

  # Where matched packets go after Penny is done with them.
  egress:             platform/egress_raw_socket.yaml

  # gRPC daemon listen address (only used by `pennyd`, ignored by the CLI).
  grpc:               platform/grpc.yaml
