log:
  mode: console
  level: info

# Passive observation example. The pipeline mirrors traffic without
# touching the data path: AF_PACKET copies frames out of the kernel,
# the runtime policy runs in passive mode, and egress is disabled so
# nothing is reinjected. Includes are resolved relative to this file
# and the combined config is schema-validated before OpenPenny starts.
includes:
  traffic_policy: policies/traffic_default.yaml
  runtime_policy: policies/runtime_passive.yaml
  platform: platform/af_xdp.yaml
  traffic_forwarding: platform/forwarding_disabled.yaml
  egress: platform/egress_none.yaml
  grpc: platform/grpc.yaml
