# Minimal active-mode configuration — single file, no includes.
#
# The shortest config that runs an active Penny test. Drops a small
# fraction of packets in matched flows and watches retransmissions to
# decide closed-loop vs not.
#
# Use this as a teaching / first-read reference. The production-shaped
# example with includes is `config_default.yaml`.
#
# Run:
#   sudo ./build/openpenny_cli \
#       --config examples/configs/config_minimal_active.yaml \
#       --iface <ifname> --queue 0 --tun xdp-tun

log:
  mode: console
  level: info

traffic_policy:
  default: exclude
  rules:
    - name: example-tcp-5201
      decision: include
      protocol: tcp
      dst_port: 5201

runtime_policy:
  mode: active
  safety:
    allow_ssh_bypass: true
  aggregates:
    enabled: true
  thresholds:
    packet_drop_probability: 0.05
    max_packet_drops_per_flow: 6
    max_packet_drops_global_aggregate: 12
    stop_after_individual_flows: 10
    min_closed_loop_flows: 5

platform:
  backend: af_xdp
  ingress_mode: auto
  # interface / queue / queue_count come from the CLI flags above.

egress:
  kind: tun
  device: xdp-tun
  tun:
    multi_queue: true
    mtu: 9000
    rp_filter_loose: true
