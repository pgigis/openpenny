# Passive-mode runtime policy: observe, never drop.
# Tuning details: docs/run/tuning-reference.md.

mode: passive

safety:
  allow_ssh_bypass: true

aggregates:
  enabled: false

thresholds:
  passive_min_flows_to_finish: 10
  passive_max_parallel_flows: 10
  passive_max_execution_time_seconds: 150
