# Active-mode runtime policy: drop a few packets, watch retransmits.
# Tuning details: docs/run/tuning-reference.md.
# Passive-mode equivalent: policies/runtime_passive.yaml.

mode: active

safety:
  allow_ssh_bypass: true

aggregates:
  enabled: true

thresholds:
  packet_drop_probability: 0.05
  max_packet_drops_per_flow: 6
  max_packet_drops_global_aggregate: 12
  stop_after_individual_flows: 10
  min_closed_loop_flows: 5
